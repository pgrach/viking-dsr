# Hydro Bitcoin Mining Optimizer Configuration

# ASIC Specifications
asic:
  model: "Whatsminer M63s++ Hydro"
  hash_rate_th: 460
  watts_per_th: 15.5
  price_usd_per_th: 14.9
  overclocking_enabled: true

# Operating Costs
operating_costs:
  annual_usd: 300000  # Annual operating expenses
  
# Simulation Parameters
simulation:
  n_simulations: 1000   # Number of Monte Carlo simulations
  fleet_step: 15       # Step size for fleet optimization (increased for fewer tests)
  projection_years: 5  # Years to project forward

# Economic Scenarios
scenarios:
  custom:
    name: "Custom Parameters"
    difficulty_growth_annual: 0.10
    price_change_annual: 0.10
    price_volatility_annual: 0.10
    description: "Adjustable parameters based on historical data"

# Financial Parameters
financial:
  pool_fee_percent: 0.02             # 2% mining pool fee
  discount_rate_percent: 0.10        # 10% discount rate
  additional_upfront_costs: 20000000 # $20M upfront costs